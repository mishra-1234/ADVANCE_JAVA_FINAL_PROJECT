<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - CyberShield</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<main class="auth">
    <section class="auth__panel" style="margin: auto;">
        <div class="login-card">
            <h2 class="login-card__title">Forgot Password</h2>
            <p class="login-card__subtitle">Enter your registered email to reset password.</p>

            <form class="login-form" action="forgotpassword" method="post">
                <input type="hidden" name="action" value="verify">

                <div class="form-field">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 10px;">
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--block" style="margin-top: 15px;">
                    <span class="btn__label">Verify Email</span>
                </button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="login.html" style="color: #2563eb; text-decoration: none;">Back to Login</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
