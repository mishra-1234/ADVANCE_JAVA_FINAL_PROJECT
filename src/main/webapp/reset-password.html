<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - CyberShield</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<main class="auth">
    <section class="auth__panel" style="margin: auto;">
        <div class="login-card">
            <h2 class="login-card__title">Reset Password</h2>
            <p class="login-card__subtitle">Enter your new password below.</p>

            <form class="login-form" action="forgotpassword" method="post">
                <input type="hidden" name="action" value="update">

                <div class="form-field">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrap">
                        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required style="width: 100%; padding: 10px;">
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--block" style="margin-top: 15px;">
                    <span class="btn__label">Update Password</span>
                </button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
